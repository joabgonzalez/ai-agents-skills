<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.07"/>
    </pattern>
    <!-- Grid radial fade -->
    <radialGradient id="gridFade" cx="90%" cy="50%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
    <!-- Exact logo bolt gradient (same as Logo.astro) -->
    <radialGradient id="bolt" cx="45%" cy="32%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="45%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Logo bolt: viewBox="0 0 24 44", scaled to ~200px tall, positioned at left -->
  <!-- Scale factor: 200/44 ≈ 4.545 → width = 24*4.545 ≈ 109px -->
  <!-- Centered vertically: (630 - 200) / 2 = 215 -->
  <g transform="translate(72, 215) scale(4.545)">
    <path
      d="M4 25 L14 4 L12 19 L20 19 L10 40 L12 25 Z"
      fill="url(#bolt)"
      stroke="#92400e"
      stroke-width="0.33"
      stroke-linejoin="round"
      paint-order="stroke"
    />
  </g>

  <!-- AGENTS -->
  <text
    x="220" y="295"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="100"
    letter-spacing="10"
    fill="#f9fafb"
  >AGENTS</text>

  <!-- SKILLS -->
  <text
    x="220" y="415"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="100"
    letter-spacing="10"
    fill="#f9fafb"
  >SKILLS</text>

  <!-- Tagline -->
  <text
    x="220" y="482"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-weight="400"
    font-size="26"
    fill="#6b7280"
  >Curated behavioral skills for AI coding assistants</text>

  <!-- Pills -->
  <rect x="220" y="512" width="162" height="36" rx="18" fill="#172554"/>
  <text x="301" y="536" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#60a5fa" text-anchor="middle">62+ skills</text>

  <rect x="396" y="512" width="172" height="36" rx="18" fill="#052e16"/>
  <text x="482" y="536" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">11 agents</text>

  <rect x="582" y="512" width="152" height="36" rx="18" fill="#1e1b4b"/>
  <text x="658" y="536" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#a78bfa" text-anchor="middle">1 CLI</text>
</svg>
