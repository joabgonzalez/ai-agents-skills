name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ startsWith(github.event.head_commit.message, 'release(') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Detect release type
        id: bump-type
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          if [[ "$MESSAGE" =~ ^release\((patch|minor|major)\): ]]; then
            echo "type=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Commit message does not match release(patch|minor|major): convention — skipping" >&2
            exit 1
          fi

      - name: Bump version and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump-type.outputs.type }} -m "%s"
          git push origin HEAD:main --follow-tags

      - name: Inject PostHog telemetry key
        run: |
          if [ -z "${{ secrets.POSTHOG_KEY }}" ]; then
            echo "⚠️ POSTHOG_KEY secret not set — telemetry will be disabled"
          fi
          sed -i "s/__POSTHOG_KEY__/${{ secrets.POSTHOG_KEY }}/" src/utils/telemetry.ts

      - name: Build
        run: npm run build

      - name: Deploy to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update README version badge
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/\*\*v[0-9]*\.[0-9]*\.[0-9]*\*\*/**v${VERSION}**/" README.md
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README version to v${VERSION}"
          git push origin HEAD:main

      - name: Sync back to development
        run: |
          git checkout development
          git pull origin development
          git merge main --no-edit -X theirs
          git push origin development
